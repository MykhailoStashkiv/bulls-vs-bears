<html lang="uk">
<head>
<meta charset="utf-8">

<title>BullBear</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 18px}
.top{display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:16px;white-space:nowrap}.logo b{color:var(--g)}.logo i{color:var(--r);font-style:normal}
.sp{flex:1}
.ib{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:6px 9px;font-size:15px;cursor:pointer}

.bar{height:12px;border-radius:9px;background:var(--r);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#00a862,var(--g));transition:width .6s}
.bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff9}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.st b{display:block;font-size:15px}.st span{font-size:10.5px;color:var(--mut)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font-weight:800;padding:8px;border-radius:9px;font-size:13.5px}
.seg button.on{background:#1b2030;color:var(--txt)}
#chart{height:240px;margin-top:10px}
#feed{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ev{display:flex;gap:10px;padding:9px 10px;border-radius:12px;background:var(--panel);border-left:4px solid #555;animation:in .4s ease-out}
.ev.g{border-color:var(--g)}.ev.r{border-color:var(--r)}.ev.y{border-color:var(--y)}
.ev .ic{font-size:21px;line-height:1.2}.ev b{display:block;font-size:13.5px}.ev small{color:var(--mut);display:block;margin-top:2px;font-size:11.5px}

#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:9;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{width:100%;max-width:520px;padding:11px 13px;border-radius:14px;background:#151826f2;border:1px solid;font-weight:900;font-size:14.5px;box-shadow:0 10px 30px #000a;animation:tin 4.5s forwards}
.toast.g{border-color:var(--g);box-shadow:0 0 24px #00f59355}.toast.r{border-color:var(--r);box-shadow:0 0 24px #ff3b5c55}.toast.y{border-color:var(--y)}
.toast small{display:block;font-weight:600;color:var(--mut);margin-top:2px;font-size:12px}
@keyframes tin{0%{transform:translateY(-130%)}8%{transform:none}86%{opacity:1}100%{opacity:0;transform:translateY(-20%)}}
.foot{margin-top:14px;font-size:11px;color:var(--mut);line-height:1.5;text-align:center}
.ex{display:flex;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap}.ex span:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#555;margin-right:4px;vertical-align:1px}.ex span.on:before{background:var(--g)}
</style>
</head>

</div>
