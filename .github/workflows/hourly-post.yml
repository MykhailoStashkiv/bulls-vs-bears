name: BullBear hourly post

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib==3.9.2
      - run: python autopost/post.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: "@BullBearLive"
          PYTHONUNBUFFERED: "1"
